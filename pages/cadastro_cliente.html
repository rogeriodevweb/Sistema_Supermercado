
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro do Cliente - Supermercado</title>

    <link rel="stylesheet" href="../style/cadastro_cliente.css">
</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro-card">

            <div class="logo">
                🛒
            </div>

            <h1>Supermercado</h1>

            <p class="subtitulo">
                Crie sua conta
            </p>

            <form id="cadastroForm">

                <!-- NOME -->
                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        maxlength="200"
                        required
                    >
                </div>

                <!-- CPF -->
                <div class="campo">
                    <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        autocomplete="off"
                        inputmode="numeric"
                        maxlength="14"
                        required
                    >
                </div>

                <!-- TELEFONE -->
                <div class="campo">
                    <label for="telefone">Telefone</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        autocomplete="tel"
                        inputmode="tel"
                        maxlength="15"
                        required
                    >
                </div>

                <!-- E-MAIL -->
                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        maxlength="200"
                        required
                    >
                </div>

                <!-- SENHA -->
                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="senha-container">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="mostrar-senha"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <div class="senha-container">
                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarConfirmarSenha"
                            class="mostrar-senha"
                            aria-label="Mostrar confirmação da senha"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <!-- MENSAGEM -->
                <div
                    id="mensagem"
                    class="mensagem"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- SALVAR -->
                <button
                    type="submit"
                    class="btn-cadastrar"
                >
                    Salvar cadastro
                </button>

            </form>

            <div class="login-link">
                <span>Já possui uma conta?</span>

                <a href="../pages/login_cliente.html">
                    Entrar
                </a>
            </div>

        </section>

    </main>

    <!-- JAVASCRIPT EXTERNO -->
    <script src="../js/cadastro_cliente.js"></script>

</body>

</html>
